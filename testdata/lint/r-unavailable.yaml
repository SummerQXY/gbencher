# Lint fixture: the only defect is the use of r in an aggregate rule, which has no resource block
# and so no r.
dsl_version: 1
benchmark:
  id: cis-lint-fixtures
  version: "1.0.0"
  section: "1"
  title: Lint fixtures
rules:
  - id: cis-lint-r-unavailable-1
    ref: "1.1"
    title: Fixture that uses r where there is none
    profile: L1
    cis_assessment: automated
    mode: deterministic
    severity: low
    scope: project
    services: [compute.googleapis.com]
    collect:
      - id: instances
        gcloud: compute instances list --project={{ .project }} --format=json
    check:
      assert: size(data.instances) > 0 && r.ok
      message: "The project has no instances"
    remediation: Create an instance.
    notes: Fixture for the lint tests.
