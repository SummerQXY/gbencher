# Lint fixture: the only defect is a step that attaches its result to elements but has no foreach
# to say which elements.
dsl_version: 1
benchmark:
  id: cis-lint-fixtures
  version: "1.0.0"
  section: "1"
  title: Lint fixtures
rules:
  - id: cis-lint-attach-without-foreach-1
    ref: "1.1"
    title: Fixture with an attach that has no foreach
    profile: L1
    cis_assessment: automated
    mode: deterministic
    severity: low
    scope: project
    services: [iam.googleapis.com]
    collect:
      - id: service_accounts
        attach: accounts
        gcloud: iam service-accounts list --project={{ .project }} --format=json
    resource:
      from: data.service_accounts
      kind: iam.googleapis.com/ServiceAccount
      name: r.email
    check:
      assert: r.disabled == false
      message: "Service account {{ .r.email }} is disabled"
    remediation: Enable the service account.
    notes: Fixture for the lint tests.
