# Lint fixture: the only defect is a reference to a param the rule does not define.
dsl_version: 1
benchmark:
  id: cis-lint-fixtures
  version: "1.0.0"
  section: "1"
  title: Lint fixtures
rules:
  - id: cis-lint-params-ref-undefined-1
    ref: "1.1"
    title: Fixture that reads a param that does not exist
    profile: L1
    cis_assessment: automated
    mode: deterministic
    severity: low
    scope: project
    services: [compute.googleapis.com]
    collect:
      - id: instances
        gcloud: compute instances list --project={{ .project }} --format=json
    resource:
      from: data.instances
      kind: compute.googleapis.com/Instance
      name: r.name
    params:
      expected_status: RUNNING
    check:
      assert: r.status == params.wanted_status
      message: "Instance {{ .r.name }} is not {{ .params.expected_status }}"
    remediation: Start the instance.
    notes: Fixture for the lint tests.
