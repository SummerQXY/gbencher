# Lint fixture: the only defect is the unquoted ref below, which YAML reads as a number and the
# rule schema requires to be a string. rule.ParseFile reports exactly one violation for it.
dsl_version: 1
benchmark:
  id: cis-lint-fixtures
  version: "1.0.0"
  section: "1"
  title: Lint fixtures
rules:
  - id: cis-lint-schema-1
    ref: 6.1
    title: Fixture with a ref that is not quoted
    profile: L1
    cis_assessment: automated
    mode: deterministic
    severity: low
    scope: project
    services: [compute.googleapis.com]
    collect:
      - id: instances
        gcloud: compute instances list --project={{ .project }} --format=json
    resource:
      from: data.instances
      kind: compute.googleapis.com/Instance
      name: r.name
    check:
      assert: r.status == "RUNNING"
      message: "Instance {{ .r.name }} is not running"
    remediation: Start the instance.
    notes: Fixture for the lint tests.
