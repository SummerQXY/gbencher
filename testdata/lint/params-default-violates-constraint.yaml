# Lint fixture: the only defect is a param whose default value breaks its own constraint (12 is
# above the maximum of 10), so the rule would fail with no override at all.
dsl_version: 1
benchmark:
  id: cis-lint-fixtures
  version: "1.0.0"
  section: "1"
  title: Lint fixtures
rules:
  - id: cis-lint-params-default-violates-constraint-1
    ref: "1.1"
    title: Fixture with a default that breaks its constraint
    profile: L1
    cis_assessment: automated
    mode: deterministic
    severity: low
    scope: project
    services: [compute.googleapis.com]
    collect:
      - id: instances
        gcloud: compute instances list --project={{ .project }} --format=json
    resource:
      from: data.instances
      kind: compute.googleapis.com/Instance
      name: r.name
    params:
      max_disks: 12
    params_constraints:
      max_disks:
        minimum: 0
        maximum: 10
    check:
      assert: size(r.disks) <= params.max_disks
      message: "Instance {{ .r.name }} has more than {{ .params.max_disks }} disks"
    remediation: Detach the extra disks.
    notes: Fixture for the lint tests.
