dsl_version: 1
benchmark: {id: cis-example, version: "1.0.0"}
rules:
  - id: cis-example-1.1
    ref: "1.1"
    title: Ensure a shell step is rejected
    profile: L1
    cis_assessment: automated
    mode: deterministic
    severity: medium
    scope: project
    collect:
      - id: output
        shell: echo example
    check:
      assert: data.output == "example"
    remediation: Remove the step.
    notes: Fixture for schema tests.
