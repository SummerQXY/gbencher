dsl_version: 1
benchmark: {id: cis-example, version: "1.0.0"}
rules:
  - id: cis-example-1.1
    ref: "1.1"
    title: Ensure removed capabilities are rejected
    profile: L1
    cis_assessment: automated
    mode: deterministic
    severity: medium
    scope: project
    requires: [node-exec, shell]
    collect:
      - id: items
        gcloud: compute instances list --project={{ .project }} --format=json
    check:
      assert: size(data.items) == 0
    remediation: Remove the capabilities.
    notes: Fixture for schema tests.
