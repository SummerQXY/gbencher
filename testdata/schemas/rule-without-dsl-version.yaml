benchmark: {id: cis-example, version: "1.0.0"}
rules:
  - id: cis-example-1.1
    ref: "1.1"
    title: Ensure the file declares its DSL version
    profile: L1
    cis_assessment: automated
    mode: deterministic
    severity: medium
    scope: project
    collect:
      - id: items
        gcloud: compute instances list --project={{ .project }} --format=json
    check:
      assert: size(data.items) == 0
    remediation: Add dsl_version.
    notes: Fixture for schema tests.
