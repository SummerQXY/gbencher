dsl_version: 1
benchmark:
  id: cis-gcp-foundation
  version: "5.0.0"
  section: "3"
  title: Networking
rules:
  - id: cis-gcp-3.1
    ref: "3.1"
    title: Ensure That the Default Network Does Not Exist in a Project
    profile: L2
    cis_assessment: automated
    mode: deterministic
    severity: medium
    scope: project
    services: [compute.googleapis.com]
    collect:
      - id: networks
        gcloud: compute networks list --project={{ .project }} --format=json
    resource:
      from: data.networks
      kind: compute.googleapis.com/Network
      name: r.name
      empty: pass
    check:
      assert: r.name != "default"
      message: "Project {{ .project }} has a VPC network named default"
    evidence:
      - r.x_gcloud_subnet_mode
      - size(r.?subnetworks.orValue([]))
    remediation: |
      Migrate workloads to a custom-mode network and delete the default-allow-* firewall rules, then:
      gcloud compute networks delete default --project=<PROJECT_ID>
      Prevent re-creation with the organization policy constraint compute.skipDefaultNetworkCreation.
    references:
      - https://cloud.google.com/vpc/docs/vpc#default-network
      - https://cloud.google.com/compute/docs/networking#firewall_rules
      - https://cloud.google.com/sdk/gcloud/reference/compute/networks/delete
    notes: |
      Mirrors the CIS audit: every VPC network in the project is evaluated and the one named "default"
      fails; a project without networks passes. As in CIS only the name is checked, so a renamed
      auto-mode network is not flagged; the permissive default-allow-* firewall rules it ships with are
      covered by 3.6 and 3.7. The compute.skipDefaultNetworkCreation organization policy stops new
      projects from getting a default network but does not remove existing ones.

  - id: cis-gcp-3.2
    ref: "3.2"
    title: Ensure Legacy Networks Do Not Exist for Older Projects
    profile: L1
    cis_assessment: automated
    mode: deterministic
    severity: low
    scope: project
    services: [compute.googleapis.com]
    collect:
      - id: networks
        gcloud: compute networks list --project={{ .project }} --format=json
    resource:
      from: data.networks
      kind: compute.googleapis.com/Network
      name: r.name
      empty: pass
    check:
      assert: |
        !has(r.IPv4Range) && r.?x_gcloud_subnet_mode.orValue("") != "LEGACY"
      message: "Network {{ .r.name }} is a legacy network (single range {{ .r.IPv4Range }}, no subnetworks)"
    evidence: [r.IPv4Range, r.gatewayIPv4, r.x_gcloud_subnet_mode]
    remediation: |
      gcloud compute networks create <NEW_NETWORK_NAME> --subnet-mode=custom --project=<PROJECT_ID>
      then create subnets, migrate instances, firewall rules, routes and VPN/Interconnect, and run:
      gcloud compute networks delete <LEGACY_NETWORK_NAME> --project=<PROJECT_ID>
    references:
      - https://cloud.google.com/vpc/docs/using-legacy#creating_a_legacy_network
      - https://cloud.google.com/vpc/docs/using-legacy#deleting_a_legacy_network
    notes: |
      A legacy network is identified by the network-wide REST field IPv4Range, which only legacy
      networks carry, or by the gcloud-computed x_gcloud_subnet_mode LEGACY; either signal fails.
      Legacy networks cannot be converted in place, so remediation is a migration to a new custom or
      auto mode network. The default is compliant (legacy networks can no longer be created), and a
      project without networks passes.

  - id: cis-gcp-3.3
    ref: "3.3"
    title: Ensure That DNSSEC Is Enabled for Cloud DNS
    profile: L1
    cis_assessment: automated
    mode: deterministic
    severity: medium
    scope: project
    services: [dns.googleapis.com]
    collect:
      - id: zones
        gcloud: dns managed-zones list --project={{ .project }} --format=json
    resource:
      from: data.zones
      filter: r.?visibility.orValue("public") == "public"
      kind: dns.googleapis.com/ManagedZone
      name: r.name
    check:
      assert: r.?dnssecConfig.?state.orValue("off") == "on"
      message: "Public zone {{ .r.name }} ({{ .r.dnsName }}) does not have DNSSEC on"
    evidence: [r.dnsName, r.dnssecConfig]
    remediation: |
      gcloud dns managed-zones update <ZONE_NAME> --dnssec-state on --project=<PROJECT_ID>
      then publish the zone's DS record at the domain registrar.
    references:
      - https://cloud.google.com/dns/dnssec-config#enabling
      - https://cloud.google.com/dns/dnssec
    notes: |
      Mirrors the CIS audit for every zone with visibility public; private zones (including
      forwarding, peering and reverse lookup zones) do not support DNSSEC and are filtered out.
      DNSSEC is off by default, so a missing dnssecConfig fails, and the transitional "transfer" state
      also fails until the zone is switched to "on" (exempt the zone while a transfer is in progress).
      Whether the DS record is published at the parent zone is not observable through the Cloud DNS API.

  - id: cis-gcp-3.4
    ref: "3.4"
    title: Ensure That RSASHA1 Is Not Used for the Key-Signing Key in Cloud DNS DNSSEC
    profile: L1
    cis_assessment: automated
    mode: deterministic
    severity: medium
    scope: project
    services: [dns.googleapis.com]
    collect:
      - id: zones
        gcloud: dns managed-zones list --project={{ .project }} --format=json
    resource:
      from: data.zones
      filter: r.?visibility.orValue("public") == "public"
      kind: dns.googleapis.com/ManagedZone
      name: r.name
    check:
      assert: |
        !r.?dnssecConfig.?defaultKeySpecs.orValue([]).exists(k,
          k.?keyType.orValue("") == "keySigning"
          && k.?algorithm.orValue("").lowerAscii() == "rsasha1")
      message: "Public zone {{ .r.name }} uses RSASHA1 for its DNSSEC key-signing key"
    evidence: [r.dnssecConfig.state, r.dnssecConfig.defaultKeySpecs]
    remediation: |
      Remove the zone's DS record at the registrar, then:
      gcloud dns managed-zones update <ZONE_NAME> --dnssec-state off
      gcloud dns managed-zones update <ZONE_NAME> --dnssec-state on --ksk-algorithm <KSK_ALGORITHM> --ksk-key-length <KSK_KEY_LENGTH> --zsk-algorithm <ZSK_ALGORITHM> --zsk-key-length <ZSK_KEY_LENGTH> --denial-of-existence <DENIAL_OF_EXISTENCE>
      and publish the new DS record.
    references:
      - https://cloud.google.com/dns/dnssec-advanced#advanced_signing_options
    notes: |
      Evaluates the keySigning entry of dnssecConfig.defaultKeySpecs on every public zone, as the CIS
      audit does, regardless of the DNSSEC state. A zone with DNSSEC off and no key specs therefore
      passes vacuously; 3.3 reports it. Algorithm names are compared case-insensitively. Key length is
      not evaluated, as in CIS.

  - id: cis-gcp-3.5
