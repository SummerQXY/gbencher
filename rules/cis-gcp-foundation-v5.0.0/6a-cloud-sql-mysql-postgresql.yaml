  - id: cis-gcp-6.2.4
    ref: "6.2.4"
    title: Ensure ‘Log_statement’ Database Flag for Cloud SQL PostgreSQL Instance Is Set Appropriately
    profile: L2
    cis_assessment: automated
    mode: contextual
    severity: low
    scope: project
    services: [sqladmin.googleapis.com]
    collect:
      - id: sql_instances
        gcloud: sql instances list --project={{ .project }} --format=json
    resource:
      from: data.sql_instances
      filter: 'r.?databaseVersion.orValue("").startsWith("POSTGRES") && r.?instanceType.orValue("") != "ON_PREMISES_INSTANCE"'
      kind: sqladmin.googleapis.com/Instance
      name: r.name
    params:
      flag: log_statement
      allowed_values: [ddl]
      review_values: [mod, all]
      unset_value: none  # effective value when the flag is not set
    check:
      assert: |
        (r.?settings.?databaseFlags.orValue([]).exists(f, f.name == params.flag)
          ? r.settings.databaseFlags.filter(f, f.name == params.flag).map(f, f.?value.orValue("").lowerAscii())
          : [params.unset_value]
        ).all(v, v in params.allowed_values || v in params.review_values)
      review_when: |
        (r.?settings.?databaseFlags.orValue([]).exists(f, f.name == params.flag)
          ? r.settings.databaseFlags.filter(f, f.name == params.flag).map(f, f.?value.orValue("").lowerAscii())
          : [params.unset_value]
        ).exists(v, v in params.review_values && !(v in params.allowed_values))
      message: "PostgreSQL instance {{ .r.name }}: effective {{ .params.flag }} (configured, or {{ .params.unset_value }} when unset) is not in {{ .params.allowed_values }}"
      review_message: "PostgreSQL instance {{ .r.name }} sets {{ .params.flag }} to a value in {{ .params.review_values }}, which logs more than DDL; confirm it matches the organization's logging policy (CIS recommends ddl)"
    evidence:
      - r.databaseVersion
      - 'r.?settings.?databaseFlags.orValue([]).filter(f, f.name == params.flag)'
    remediation: |
      gcloud sql instances patch <INSTANCE> --database-flags=log_statement=ddl
      (--database-flags replaces every flag on the instance; include the existing flags in the same command)
    references:
      - https://cloud.google.com/sql/docs/postgres/flags
      - https://www.postgresql.org/docs/current/runtime-config-logging.html#GUC-LOG-STATEMENT
    notes: |
      "Set appropriately" depends on the organization's logging policy (CIS recommends ddl unless the
      policy directs otherwise), so the policy is held in params. The effective value is the
      configured value, or unset_value (none, the default) when the flag is not set. Values in
      allowed_values pass; values in review_values produce REVIEW because mod and all log DDL plus
      data-modifying or all statements, which raises log volume and may capture sensitive data;
      anything else, including none, fails. Tune allowed_values and review_values to the logging
      policy (for example add all to allowed_values) to make the result deterministic. Values are
      compared case-insensitively. Source representation instances (instanceType
      ON_PREMISES_INSTANCE) are excluded.

  - id: cis-gcp-6.2.5
    ref: "6.2.5"
    title: Ensure that the ‘Log_min_messages’ Flag for a Cloud SQL PostgreSQL Instance is set at minimum to 'Warning'
    profile: L1
    cis_assessment: automated
    mode: deterministic
    severity: medium
    scope: project
    services: [sqladmin.googleapis.com]
    collect:
      - id: sql_instances
        gcloud: sql instances list --project={{ .project }} --format=json
    resource:
      from: data.sql_instances
      filter: 'r.?databaseVersion.orValue("").startsWith("POSTGRES") && r.?instanceType.orValue("") != "ON_PREMISES_INSTANCE"'
      kind: sqladmin.googleapis.com/Instance
      name: r.name
    params:
      flag: log_min_messages
      min_level: warning
      unset_value: warning  # effective value when the flag is not set
      severity_rank:  # PostgreSQL message severity, lowest to highest
        debug5: 0
        debug4: 1
        debug3: 2
        debug2: 3
        debug1: 4
        info: 5
        notice: 6
        warning: 7
        error: 8
        log: 9
        fatal: 10
        panic: 11
    check:
      assert: |
        (r.?settings.?databaseFlags.orValue([]).exists(f, f.name == params.flag)
          ? r.settings.databaseFlags.filter(f, f.name == params.flag).map(f, f.?value.orValue("").lowerAscii())
          : [params.unset_value]
        ).all(v, v in params.severity_rank
             && params.severity_rank[v] >= params.severity_rank[params.min_level])
      message: "PostgreSQL instance {{ .r.name }}: effective {{ .params.flag }} (configured, or {{ .params.unset_value }} when unset) is below {{ .params.min_level }} or not a valid level"
    evidence:
      - r.databaseVersion
      - 'r.?settings.?databaseFlags.orValue([]).filter(f, f.name == params.flag)'
    remediation: |
      gcloud sql instances patch <INSTANCE> --database-flags=log_min_messages=warning
      (or error, the CIS best practice; --database-flags replaces every flag on the instance, so include the existing flags)
    references:
      - https://cloud.google.com/sql/docs/postgres/flags
      - https://www.postgresql.org/docs/current/runtime-config-logging.html#GUC-LOG-MIN-MESSAGES
    notes: |
      The PostgreSQL severity order (debug5 lowest to panic highest) is held in severity_rank, and the
      effective value (configured value, or unset_value when the flag is not set) must rank at or
      above min_level. CIS states the default is ERROR while PostgreSQL documents WARNING; both meet
      the default threshold, so an unset flag passes, and unset_value is the lower of the two so that
      raising min_level to error (the CIS best practice) cannot pass an unset instance by accident.
      Unknown values fail. Ranks are a map because the CEL lists extension has no list indexOf.
      Source representation instances (instanceType ON_PREMISES_INSTANCE) are excluded.

  - id: cis-gcp-6.2.6
    ref: "6.2.6"
    title: Ensure ‘Log_min_error_statement’ Database Flag for Cloud SQL PostgreSQL Instance Is Set to ‘Error’ or Stricter
