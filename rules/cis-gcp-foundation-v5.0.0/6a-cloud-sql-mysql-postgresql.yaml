  - id: cis-gcp-6.2.1
    ref: "6.2.1"
    title: Ensure ‘Log_error_verbosity’ Database Flag for Cloud SQL PostgreSQL Instance Is Set to ‘DEFAULT’ or Stricter
    profile: L2
    cis_assessment: automated
    mode: deterministic
    severity: low
    scope: project
    services: [sqladmin.googleapis.com]
    collect:
      - id: sql_instances
        gcloud: sql instances list --project={{ .project }} --format=json
    resource:
      from: data.sql_instances
      filter: 'r.?databaseVersion.orValue("").startsWith("POSTGRES") && r.?instanceType.orValue("") != "ON_PREMISES_INSTANCE"'
      kind: sqladmin.googleapis.com/Instance
      name: r.name
    params:
      flag: log_error_verbosity
      allowed_values: [default, verbose]
      unset_value: default  # effective value when the flag is not set
    check:
      assert: |
        (r.?settings.?databaseFlags.orValue([]).exists(f, f.name == params.flag)
          ? r.settings.databaseFlags.filter(f, f.name == params.flag).map(f, f.?value.orValue("").lowerAscii())
          : [params.unset_value]
        ).all(v, v in params.allowed_values)
      message: "PostgreSQL instance {{ .r.name }}: effective {{ .params.flag }} (configured, or {{ .params.unset_value }} when unset) is not in {{ .params.allowed_values }}"
    evidence:
      - r.databaseVersion
      - 'r.?settings.?databaseFlags.orValue([]).filter(f, f.name == params.flag)'
    remediation: |
      gcloud sql instances patch <INSTANCE> --database-flags=log_error_verbosity=default
      (--database-flags replaces every flag on the instance; include the existing flags in the same command)
    references:
      - https://cloud.google.com/sql/docs/postgres/flags
      - https://www.postgresql.org/docs/current/runtime-config-logging.html#GUC-LOG-ERROR-VERBOSITY
    notes: |
      The default (DEFAULT) is compliant, so an unset flag passes: the effective value is the
      configured value, or unset_value when the flag is not set, and it must be in allowed_values.
      CIS does not define "stricter"; this rule reads it as at least the DEFAULT level of detail, so
      TERSE, which drops DETAIL, HINT, QUERY and CONTEXT from error logs, fails. Organizations that
      read "stricter" as less verbose can set allowed_values to [terse, default]. Values are compared
      case-insensitively. Source representation instances (instanceType ON_PREMISES_INSTANCE) are
      excluded.

