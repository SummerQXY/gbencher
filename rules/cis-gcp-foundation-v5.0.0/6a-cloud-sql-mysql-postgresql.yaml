dsl_version: 1
benchmark:
  id: cis-gcp-foundation
  version: "5.0.0"
  section: "6"
  title: Cloud SQL Database Services (MySQL and PostgreSQL flags)
rules:
  - id: cis-gcp-6.1.1
    ref: "6.1.1"
    title: Ensure That a MySQL Instance Does Not Allow Anyone To Connect With Administrative Privileges
    profile: L1
    cis_assessment: manual
    mode: deterministic
    severity: high
    scope: project
    services: [sqladmin.googleapis.com]
    collect:
      - id: sql_instances
        gcloud: sql instances list --project={{ .project }} --format=json
      - id: users
        foreach: |
          data.sql_instances.filter(i,
            i.?databaseVersion.orValue("").startsWith("MYSQL")
            && i.?instanceType.orValue("CLOUD_SQL_INSTANCE") == "CLOUD_SQL_INSTANCE"
            && i.?state.orValue("") == "RUNNABLE"
            && i.?settings.?activationPolicy.orValue("ALWAYS") != "NEVER")
        as: i
        attach: users
        gcloud: sql users list --instance={{ .i.name }} --project={{ .project }} --format=json
    resource:
      from: data.sql_instances
      filter: |
        r.?databaseVersion.orValue("").startsWith("MYSQL")
        && r.?instanceType.orValue("CLOUD_SQL_INSTANCE") == "CLOUD_SQL_INSTANCE"
        && r.?state.orValue("") == "RUNNABLE"
        && r.?settings.?activationPolicy.orValue("ALWAYS") != "NEVER"
      kind: sqladmin.googleapis.com/Instance
      name: r.name
    params:
      admin_users: [root]
      open_hosts: ["%", ""]
    check:
      assert: |
        !r.?users.orValue([]).exists(u,
          u.name in params.admin_users
          && u.?type.orValue("BUILT_IN") == "BUILT_IN"
          && u.?host.orValue("") in params.open_hosts)
      message: "MySQL instance {{ .r.name }} has a built-in admin user from {{ .params.admin_users }} that accepts connections from any host; the Admin API cannot confirm that its password is set"
    evidence:
      - 'r.?users.orValue([]).map(u, u.name + "@" + u.?host.orValue("") + " " + u.?type.orValue("BUILT_IN"))'
      - r.?settings.?ipConfiguration.?ipv4Enabled.orValue(false)
      - 'r.?settings.?ipConfiguration.?authorizedNetworks.orValue([]).map(n, n.?value.orValue(""))'
    remediation: |
      Set a strong root password (CIS): gcloud sql users set-password root --host=% --instance=<INSTANCE> --prompt-for-password
      To clear this finding, restrict the admin account to trusted hosts or use IAM database authentication:
      gcloud sql users create root --host=<TRUSTED_HOST> --instance=<INSTANCE> --password=<PASSWORD>
      then, after verifying access: gcloud sql users delete root --host=% --instance=<INSTANCE>
    references:
      - https://cloud.google.com/sql/docs/mysql/create-manage-users
      - https://cloud.google.com/sql/docs/mysql/create-instance
    notes: |
      CIS audits this by connecting as root without a password; the scanner opens no database
      connections and the Admin API never exposes whether a password is set. The rule therefore
      fails when a built-in user named in admin_users is defined for any host (host in open_hosts),
      i.e. an administrative account that any client address may try, guarded at most by a password.
      This is stricter than CIS: Cloud SQL creates root@'%' by default, so an instance with a strong
      root password still fails until the account is host-restricted, replaced by IAM database
      authentication, or exempted. Users are listed only for running primary MySQL instances
      (instanceType CLOUD_SQL_INSTANCE, state RUNNABLE, activationPolicy not NEVER): replicas inherit
      users from their primary and user listing fails on stopped instances, so those are not
      evaluated. Public IP and authorized networks are reported as evidence; network exposure itself
      is covered by 6.5 and 6.7. Add other privileged built-in accounts to admin_users.

  - id: cis-gcp-6.1.2
    ref: "6.1.2"
    title: Ensure ‘Skip_show_database’ Database Flag for Cloud SQL MySQL Instance Is Set to ‘On’
    profile: L1
    cis_assessment: automated
    mode: deterministic
    severity: medium
    scope: project
    services: [sqladmin.googleapis.com]
    collect:
      - id: sql_instances
        gcloud: sql instances list --project={{ .project }} --format=json
    resource:
      from: data.sql_instances
      filter: 'r.?databaseVersion.orValue("").startsWith("MYSQL") && r.?instanceType.orValue("") != "ON_PREMISES_INSTANCE"'
      kind: sqladmin.googleapis.com/Instance
      name: r.name
    params:
      flag: skip_show_database
      expected: "on"
    check:
      assert: |
        r.?settings.?databaseFlags.orValue([]).exists(f,
          f.name == params.flag && f.?value.orValue("").lowerAscii() == params.expected)
      message: "MySQL instance {{ .r.name }} does not set {{ .params.flag }} to {{ .params.expected }}"
    evidence:
      - r.databaseVersion
      - 'r.?settings.?databaseFlags.orValue([]).filter(f, f.name == params.flag)'
    remediation: |
      gcloud sql instances patch <INSTANCE> --database-flags=skip_show_database=on
      (--database-flags replaces every flag on the instance; include the existing flags in the same command)
    references:
      - https://cloud.google.com/sql/docs/mysql/flags
      - https://dev.mysql.com/doc/refman/5.7/en/server-system-variables.html#sysvar_skip_show_database
    notes: |
      Mirrors the CIS CLI audit, which expects the flag to be returned with value on. CIS states no
      default; the MySQL default is OFF, so an unset flag fails. Values are compared
      case-insensitively. Source representation instances (instanceType ON_PREMISES_INSTANCE) are
      excluded because Cloud SQL does not manage their flags; read replicas are evaluated because
      flags are set per instance.

