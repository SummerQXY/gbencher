      (--database-flags replaces every flag on the instance; include the existing flags in the same command)
    references:
      - https://cloud.google.com/sql/docs/postgres/flags
      - https://www.postgresql.org/docs/current/runtime-config-logging.html#GUC-LOG-MIN-ERROR-STATEMENT
    notes: |
      Same ordering technique as 6.2.5 with min_level error. The default (ERROR, per CIS and
      PostgreSQL) is compliant, so an unset flag passes; explicit values below error (debug5 to
      warning) and unknown values fail. Source representation instances (instanceType
      ON_PREMISES_INSTANCE) are excluded.

  - id: cis-gcp-6.2.7
    ref: "6.2.7"
    title: Ensure That the ‘Log_min_duration_statement’ Database Flag for Cloud SQL PostgreSQL Instance Is Set to '-1' (Disabled)
    profile: L1
    cis_assessment: automated
    mode: deterministic
    severity: medium
    scope: project
    services: [sqladmin.googleapis.com]
    collect:
      - id: sql_instances
        gcloud: sql instances list --project={{ .project }} --format=json
    resource:
      from: data.sql_instances
      filter: 'r.?databaseVersion.orValue("").startsWith("POSTGRES") && r.?instanceType.orValue("") != "ON_PREMISES_INSTANCE"'
      kind: sqladmin.googleapis.com/Instance
      name: r.name
    params:
      flag: log_min_duration_statement
      expected: "-1"
    check:
      assert: |
        !r.?settings.?databaseFlags.orValue([]).exists(f,
          f.name == params.flag && f.?value.orValue("") != params.expected)
      message: "PostgreSQL instance {{ .r.name }} sets {{ .params.flag }} to a value other than {{ .params.expected }}, so statement text is logged"
    evidence:
      - r.databaseVersion
      - 'r.?settings.?databaseFlags.orValue([]).filter(f, f.name == params.flag)'
    remediation: |
      gcloud sql instances patch <INSTANCE> --database-flags=log_min_duration_statement=-1
      (--database-flags replaces every flag on the instance; include the existing flags in the same command)
    references:
      - https://cloud.google.com/sql/docs/postgres/flags
      - https://www.postgresql.org/docs/current/runtime-config-logging.html#GUC-LOG-MIN-DURATION-STATEMENT
    notes: |
      The default (-1, disabled) is compliant, so an unset flag passes and only an explicit value
      other than -1 fails. Flag values are strings in the Admin API, so the comparison is against
      "-1". Source representation instances (instanceType ON_PREMISES_INSTANCE) are excluded.

  - id: cis-gcp-6.2.8
    ref: "6.2.8"
    title: Ensure That 'cloudsql.enable_pgaudit' Database Flag for each Cloud Sql Postgresql Instance Is Set to 'on' For Centralized Logging
    profile: L1
    cis_assessment: automated
    mode: deterministic
    severity: medium
    scope: project
    services: [sqladmin.googleapis.com]
    collect:
      - id: sql_instances
        gcloud: sql instances list --project={{ .project }} --format=json
    resource:
      from: data.sql_instances
      filter: 'r.?databaseVersion.orValue("").startsWith("POSTGRES") && r.?instanceType.orValue("") != "ON_PREMISES_INSTANCE"'
      kind: sqladmin.googleapis.com/Instance
      name: r.name
    params:
      flag: cloudsql.enable_pgaudit
      expected: "on"
      require_pgaudit_log: false  # true also requires a pgaudit.log flag that logs at least one class
    check:
      assert: |
        r.?settings.?databaseFlags.orValue([]).exists(f,
          f.name == params.flag && f.?value.orValue("").lowerAscii() == params.expected)
        && (!params.require_pgaudit_log
            || r.?settings.?databaseFlags.orValue([]).exists(f,
                 f.name == "pgaudit.log" && !(f.?value.orValue("").lowerAscii() in ["", "none"])))
      message: "PostgreSQL instance {{ .r.name }} does not set {{ .params.flag }} to {{ .params.expected }}, or require_pgaudit_log is true and no pgaudit.log flag logs at least one class"
    evidence:
      - r.databaseVersion
      - 'r.?settings.?databaseFlags.orValue([]).filter(f, f.name in [params.flag, "pgaudit.log"])'
    remediation: |
      gcloud sql instances patch <INSTANCE> --database-flags=cloudsql.enable_pgaudit=on,pgaudit.log=all
      (restarts the instance; --database-flags replaces every flag, so include the existing flags)
      then, as a superuser: CREATE EXTENSION pgaudit;
    references:
      - https://cloud.google.com/sql/docs/postgres/flags#list-flags-postgres
      - https://cloud.google.com/sql/docs/postgres/pg-audit#enable-auditing-flag
      - https://cloud.google.com/sql/docs/postgres/pg-audit#customizing-database-audit-logging
    notes: |
      The CIS default is off, so the flag must be explicitly set to on. The other CIS audit steps
      (pgaudit extension created with CREATE EXTENSION, Data Access audit logs enabled, PgAuditEntry
      records visible in Logs Explorer) need a database connection or roles/logging.privateLogViewer,
      whose absence would SKIP the whole rule, so they are not automated. The CIS remediation also
      sets pgaudit.log=all; set require_pgaudit_log to true to additionally require a pgaudit.log flag
      that logs at least one class (not none). Values are compared case-insensitively. Source
      representation instances (instanceType ON_PREMISES_INSTANCE) are excluded.
