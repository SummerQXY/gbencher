  - id: cis-gcp-2.13
    ref: "2.13"
    title: Ensure That Cloud DNS Logging Is Enabled for All VPC Networks
    profile: L1
    cis_assessment: automated
    mode: deterministic
    severity: medium
    scope: project
    services: [compute.googleapis.com]
    collect:
      - id: networks
        gcloud: compute networks list --project={{ .project }} --format=json
      - id: dns_policies
        gcloud: dns policies list --project={{ .project }} --format=json
        on_error: empty
    resource:
      from: data.networks
      kind: compute.googleapis.com/Network
      name: r.name
    check:
      assert: |
        data.dns_policies.exists(p,
          p.?enableLogging.orValue(false) == true
          && p.?networks.orValue([]).exists(n, n.?networkUrl.orValue("").endsWith("/networks/" + r.name)))
      message: "VPC network {{ .r.name }} is not bound to a DNS server policy with logging enabled"
    evidence:
      - "data.dns_policies.filter(p, p.?networks.orValue([]).exists(n, n.?networkUrl.orValue('').endsWith('/networks/' + r.name))).map(p, {'policy': p.name, 'enableLogging': p.?enableLogging.orValue(false)})"
    remediation: |
      gcloud dns policies create enable-dns-logging --enable-logging --description="Enable DNS Logging" --networks=<VPC_NETWORK_NAME>
      or for an existing policy: gcloud dns policies update <POLICY_NAME> --enable-logging --networks=<VPC_NETWORK_NAME>
    references:
      - https://cloud.google.com/dns/docs/monitoring
    notes: |
      Every VPC network in the project must be bound to a DNS server policy with enableLogging=true;
      policies are matched to a network by the name at the end of networks[].networkUrl. DNS logging
      is off by default, so a network without such a policy fails. The Cloud DNS API is deliberately
      not listed in services and its step uses on_error: empty: without the API no server policy can
      exist, so every network fails instead of the rule becoming NOT_APPLICABLE. Shared VPC service
      projects own no networks; the host project's networks are evaluated when the host is scanned.

  - id: cis-gcp-2.14
    ref: "2.14"
    title: Ensure Cloud Asset Inventory Is Enabled
    profile: L1
    cis_assessment: automated
    mode: deterministic
    severity: low
    scope: project
    collect:
      - id: enabled_services
        gcloud: services list --enabled --project={{ .project }} --format=json
    check:
      assert: |
        data.enabled_services.exists(s,
          s.?config.?name.orValue("") == "cloudasset.googleapis.com"
          || s.?name.orValue("").endsWith("/services/cloudasset.googleapis.com"))
      message: "The Cloud Asset API (cloudasset.googleapis.com) is not enabled"
    evidence:
      - "data.enabled_services.map(s, s.?config.?name.orValue('')).filter(n, n == 'cloudasset.googleapis.com')"
    remediation: gcloud services enable cloudasset.googleapis.com --project=<PROJECT_ID>
    references:
      - https://cloud.google.com/asset-inventory/docs
    notes: |
      Mirrors the CIS audit (gcloud services list --enabled). A disabled Cloud Asset API is itself the
      finding, so cloudasset.googleapis.com is deliberately not listed in services. Entries are matched
      on config.name, with the resource name suffix (projects/<n>/services/<api>) as a fallback.
      Severity is low because Asset Inventory records history without the API; the API is what enables
      search and export.

  - id: cis-gcp-2.15
    ref: "2.15"
    title: Ensure 'Access Transparency' is 'Enabled'
    profile: L2
    cis_assessment: manual
    mode: contextual
    severity: medium
    scope: project
    collect:
      - id: logs
        gcloud: logging logs list --project={{ .project }} --format=json
        on_error: empty
    params:
      fail_when_no_logs: false
    check:
      assert: |
        !params.fail_when_no_logs
        || data.logs.exists(l,
             l.endsWith("/logs/cloudaudit.googleapis.com%2Faccess_transparency")
             || l.endsWith("/logs/cloudaudit.googleapis.com/access_transparency"))
      review_when: |
        !data.logs.exists(l,
          l.endsWith("/logs/cloudaudit.googleapis.com%2Faccess_transparency")
          || l.endsWith("/logs/cloudaudit.googleapis.com/access_transparency"))
      message: "The project has no Access Transparency log and fail_when_no_logs is set"
      review_message: "No Access Transparency log entries exist in this project. Access Transparency is enabled at the organization level (IAM & Admin > Settings) and requires a Premium or Enhanced support plan; missing logs can also mean Google personnel have not accessed the project within log retention. Confirm the organization setting."
    evidence:
      - "data.logs.filter(l, l.contains('access_transparency'))"
    remediation: |
      Google Cloud console > IAM & Admin > Settings > Enable Access Transparency for Organization
      (needs the Access Transparency Admin role, roles/axt.admin, a billing account on the project and a
      qualifying support plan)
    references:
      - https://cloud.google.com/cloud-provider-access-management/access-transparency/docs/overview
      - https://cloud.google.com/cloud-provider-access-management/access-transparency/docs/enable
    notes: |
      Access Transparency has no gcloud or REST endpoint that reports whether it is enabled. Proxy:
      Access Transparency entries (log cloudaudit.googleapis.com/access_transparency, kept in the
      _Required bucket) exist only when the feature is on, so the log being present in
      gcloud logging logs list passes. Absence is REVIEW, because it also happens when Google personnel
      have not accessed the project within log retention. Set fail_when_no_logs=true to report absence
      as FAIL, e.g. after confirming the organization does not have Access Transparency enabled.

  - id: cis-gcp-2.16
    ref: "2.16"
    title: Ensure 'Access Approval' is 'Enabled'
    profile: L2
    cis_assessment: manual
    mode: deterministic
    severity: medium
    scope: project
    collect:
      - id: settings
        gcloud: access-approval settings get --project={{ .project }} --format=json
        on_error: empty
    check:
      assert: |
        size(data.settings.?enrolledServices.orValue([])) > 0
        && size(data.settings.?notificationEmails.orValue([])) > 0
      message: "Access Approval is not enrolled or has no notification emails"
    evidence: [data.settings]
    remediation: gcloud access-approval settings update --project=<PROJECT> --enrolled_services=all --notification_emails=<EMAILS>
    references:
      - https://cloud.google.com/assured-workloads/access-approval/docs/overview
    notes: |
      CIS marks this Manual because the API returns errors when the product is not enrolled.
      The API-not-enabled and FAILED_PRECONDITION errors both mean "not enabled", so on_error: empty
      turns them into an empty settings object and the assertion fails. Permission errors still SKIP.
      accessapproval.googleapis.com is deliberately not listed in services.

  - id: cis-gcp-2.17
    ref: "2.17"
    title: Ensure Logging is enabled for HTTP(S) Load Balancer
    profile: L2
    cis_assessment: automated
    mode: contextual
    severity: medium
    scope: project
    services: [compute.googleapis.com]
    collect:
      - id: backend_services
        gcloud: compute backend-services list --project={{ .project }} --format=json
    resource:
      from: data.backend_services
      filter: |
        r.?protocol.orValue("HTTP") in params.http_protocols
        && r.?loadBalancingScheme.orValue("EXTERNAL") in params.load_balancing_schemes
      kind: compute.googleapis.com/BackendService
      name: '(has(r.region) ? r.region.substring(r.region.lastIndexOf("/") + 1) : "global") + "/" + r.name'
    params:
      http_protocols: [HTTP, HTTPS, HTTP2, H2C]
      load_balancing_schemes: [EXTERNAL, EXTERNAL_MANAGED, INTERNAL_MANAGED]
      min_sample_rate: 1.0
    check:
      assert: |
        r.?logConfig.?enable.orValue(false) == true
        && r.?logConfig.?sampleRate.orValue(1.0) >= params.min_sample_rate
      message: "Backend service {{ .r.name }} has request logging disabled or a sample rate below {{ .params.min_sample_rate }}"
    evidence:
      - "r.?loadBalancingScheme.orValue('')"
      - "r.?protocol.orValue('')"
      - "r.?logConfig.orValue({})"
    remediation: gcloud compute backend-services update <BACKEND_SERVICE> --global|--region=<REGION> --enable-logging --logging-sample-rate=<RATE>
    references:
      - https://cloud.google.com/load-balancing/docs/https/https-logging-monitoring
      - https://cloud.google.com/sdk/gcloud/reference/compute/backend-services/
    notes: |
      CIS audits backend services of HTTP(S) load balancers with backend-services describe; the list
      command returns the same objects for global and regional backend services. Population: backend
      services whose protocol is in http_protocols and loadBalancingScheme in load_balancing_schemes,
      i.e. classic, global/regional external and internal Application Load Balancers by default; drop
      INTERNAL_MANAGED to cover internet-facing load balancers only. CIS leaves the sample rate to the
      organization; min_sample_rate defaults to 1.0, the rate Google applies when logging is enabled,
      so lower it to the rate your organization accepts for high-traffic services. Results are named
      <region|global>/<name> because regional backend services can share a name.
