dsl_version: 1
benchmark:
  id: cis-gcp-foundation
  version: "5.0.0"
  section: "2"
  title: Logging and Monitoring
# Rules 2.5–2.12 need alert policy data; prefer GA gcloud commands, and the JSON fields feed the CEL conditions below.
rules:
  - id: cis-gcp-2.1
    ref: "2.1"
    title: Ensure That Cloud Audit Logging Is Configured Properly
    profile: L1
    cis_assessment: automated
    mode: contextual
    severity: medium
    scope: project
    collect:
      - id: project_policy
        gcloud: projects get-iam-policy {{ .project }} --format=json
      - id: org_policy
        gcloud: organizations get-iam-policy {{ .organization }} --format=json
        on_error: skip
        requires: [org-access]
    params:
      required_log_types: [DATA_READ, DATA_WRITE]
    check:
      assert: |
        (
          !has(data.org_policy)
          || params.required_log_types.all(t,
               (data.project_policy.?auditConfigs.orValue([]) + data.?org_policy.?auditConfigs.orValue([]))
                 .exists(c, c.?service.orValue("") == "allServices"
                   && c.?auditLogConfigs.orValue([]).exists(l, l.?logType.orValue("") == t)))
        )
        && !(data.project_policy.?auditConfigs.orValue([]) + data.?org_policy.?auditConfigs.orValue([]))
             .exists(c, c.?auditLogConfigs.orValue([]).exists(l, size(l.?exemptedMembers.orValue([])) > 0))
      review_when: |
        !has(data.org_policy)
        && !params.required_log_types.all(t,
             data.project_policy.?auditConfigs.orValue([]).exists(c,
               c.?service.orValue("") == "allServices"
               && c.?auditLogConfigs.orValue([]).exists(l, l.?logType.orValue("") == t)))
      message: "Data Access audit logs {{ .params.required_log_types }} are not enabled for allServices at the project or organization level, or an auditConfigs entry sets exemptedMembers"
      review_message: "The project IAM policy has no allServices audit config with {{ .params.required_log_types }} and the organization IAM policy could not be read; confirm the configuration is inherited from the organization or a folder"
    evidence:
      - "data.project_policy.?auditConfigs.orValue([])"
      - "data.?org_policy.?auditConfigs.orValue([])"
    remediation: |
      gcloud projects get-iam-policy <PROJECT_ID> --format=json > policy.json
      add "auditConfigs": [{"service": "allServices", "auditLogConfigs": [{"logType": "DATA_READ"}, {"logType": "DATA_WRITE"}]}] without exemptedMembers, then
      gcloud projects set-iam-policy <PROJECT_ID> policy.json
      (or set it once for the organization with gcloud organizations get-iam-policy / set-iam-policy <ORG_ID>)
    references:
      - https://cloud.google.com/logging/docs/audit/
      - https://cloud.google.com/logging/docs/audit/configure-data-access
    notes: |
      CIS requires an allServices audit config with DATA_READ and DATA_WRITE and no exemptedMembers in any
      auditConfigs entry. projects get-iam-policy shows only the project's own auditConfigs, so the
      organization IAM policy is also read when org-access is available. Log types are evaluated as the
      union of both levels, as Cloud Audit Logs does for inherited configs; exemptedMembers at either level
      fails. When the project has no compliant config and the organization policy could not be read
      (org-access unavailable or no organization), the result is REVIEW; grant organization-level IAM
      policy read to converge. Folder-level configs are not read: a project that inherits the config only
      from a folder fails when the organization policy is readable, so exempt it in the profile.
      Tune required_log_types, e.g. add ADMIN_READ to mirror the console audit. BigQuery Data Access logs
      are always on and are not represented in auditConfigs.

  - id: cis-gcp-2.2
    ref: "2.2"
    title: Ensure Google Workspace/Cloud Identity Data Sharing with Google Cloud is Enabled for Admin Audit Logging
    profile: L1
    cis_assessment: manual
    mode: contextual
    severity: medium
    scope: organization
    evaluate_per: organization
    services: [logging.googleapis.com]
    requires: [org-access, workspace-admin]
    collect:
      - id: workspace_audit_entries
        gcloud: logging read 'protoPayload.serviceName="admin.googleapis.com" OR protoPayload.serviceName="login.googleapis.com"' --organization={{ .organization }} --limit=1 --freshness={{ .params.freshness_days }}d --format=json
    params:
      freshness_days: 30
      fail_when_no_entries: false
    params_constraints:
      freshness_days:
        minimum: 1
        maximum: 365
    check:
      assert: size(data.workspace_audit_entries) > 0 || !params.fail_when_no_entries
      review_when: size(data.workspace_audit_entries) == 0
      message: "No Google Workspace/Cloud Identity admin or login audit entries reached organization Cloud Logging in the last {{ .params.freshness_days }} days"
      review_message: "No Google Workspace/Cloud Identity admin or login audit entries in organization Cloud Logging in the last {{ .params.freshness_days }} days; confirm in the Google Admin console (Account > Account settings > Legal and compliance) that Google Cloud data sharing is enabled, or that there was no admin or login activity"
    evidence:
      - "data.workspace_audit_entries.map(e, e.?protoPayload.?serviceName.orValue(''))"
      - "data.workspace_audit_entries.map(e, e.?timestamp.orValue(''))"
    remediation: |
      Google Admin console as a Super Admin: Account > Account settings > Legal and compliance >
      Sharing options (Google Cloud Platform Sharing Options) > Enabled > Save.
      Then confirm in Logs Explorer at the organization level that entries with
      protoPayload.serviceName="admin.googleapis.com" arrive.
    references:
      - https://cloud.google.com/logging/docs/audit/gsuite-audit-logging
    notes: |
      CIS audits the sharing setting in the Google Admin console, which has no read API. With sharing
      enabled, Workspace/Cloud Identity Admin and login audit entries are written to the organization's
      Cloud Logging, so the rule reads one recent entry with serviceName admin.googleapis.com or
      login.googleapis.com at the organization level (gcloud logging read is read-only). Entries present
      pass. No entries is REVIEW, not FAIL, because an organization without admin or login activity in
      freshness_days has none either. Tune freshness_days; set fail_when_no_entries=true when the
      organization always has such activity in that window, so absence fails. Reading the entries needs
      roles/logging.viewer on the organization.

  - id: cis-gcp-2.3
    ref: "2.3"
    title: Ensure That Sinks Are Configured for All Log Entries
    profile: L1
    cis_assessment: automated
    mode: contextual
    severity: medium
    scope: project
    collect:
      - id: sinks
        gcloud: logging sinks list --project={{ .project }} --format=json
        on_error: empty
      - id: org_sinks
        gcloud: logging sinks list --organization={{ .organization }} --format=json
        on_error: skip
        requires: [org-access]
    check:
      assert: |
        data.sinks.exists(s,
          !s.?disabled.orValue(false)
          && s.?filter.orValue("").trim() in ["", "(empty filter)"])
        || data.?org_sinks.orValue([]).exists(s,
             s.?includeChildren.orValue(false)
             && !s.?disabled.orValue(false)
             && s.?filter.orValue("").trim() in ["", "(empty filter)"])
        || !has(data.org_sinks)
      review_when: |
        !has(data.org_sinks)
        && !data.sinks.exists(s,
             !s.?disabled.orValue(false)
             && s.?filter.orValue("").trim() in ["", "(empty filter)"])
      message: "No enabled project sink without an inclusion filter, and no enabled organization sink with includeChildren and no filter, exports all log entries"
      review_message: "No enabled project sink exports all log entries and organization sinks could not be read; confirm an aggregated sink (includeChildren, no filter) at the organization or a folder covers this project"
    evidence:
      - "data.sinks.map(s, {'name': s.name, 'destination': s.?destination.orValue(''), 'filter': s.?filter.orValue(''), 'disabled': s.?disabled.orValue(false), 'exclusions': s.?exclusions.orValue([]).map(e, e.?name.orValue(''))})"
      - "data.?org_sinks.orValue([]).map(s, {'name': s.name, 'destination': s.?destination.orValue(''), 'filter': s.?filter.orValue(''), 'includeChildren': s.?includeChildren.orValue(false)})"
    remediation: |
      gcloud logging sinks create <SINK_NAME> storage.googleapis.com/<BUCKET_NAME>
      or for all projects: gcloud logging sinks create <SINK_NAME> storage.googleapis.com/<BUCKET_NAME> --include-children --organization=<ORG_ID>
      (omit --log-filter so the sink exports every entry)
    references:
      - https://cloud.google.com/logging/docs/export/configure_export_v2
      - https://cloud.google.com/logging/docs/export/aggregated_exports
      - https://cloud.google.com/logging/docs/routing/overview
    notes: |
      A project sink qualifies when it is enabled and its inclusion filter is absent or empty; gcloud
      prints "(empty filter)" for such sinks, so that value counts as empty. The _Default and _Required
      sinks carry filters and never qualify. When org-access is available, an enabled organization sink
      with includeChildren=true and no filter also satisfies the rule. When no project sink qualifies and
      organization sinks could not be read, the result is REVIEW; grant organization-level logging read
      to converge. Folder-level aggregated sinks are not read: a project covered only by one fails when
      organization sinks are readable, so exempt it in the profile. Sink exclusions are not evaluated
      (CIS checks the inclusion filter only) and are reported in evidence. The CIS check that the
      destination exists is not automated, since destinations span Cloud Storage, BigQuery, Pub/Sub and
      log buckets in any project.

  - id: cis-gcp-2.4
    ref: "2.4"
    title: Ensure That Retention Policies on Cloud Storage Buckets Used for Exporting Logs Are Configured Using Bucket Lock
    profile: L2
    cis_assessment: automated
    mode: contextual
    severity: medium
    scope: project
    services: [logging.googleapis.com]
    collect:
      - id: sinks
        gcloud: logging sinks list --project={{ .project }} --format=json
      - id: buckets
        gcloud: storage buckets list --project={{ .project }} --format=json
        on_error: empty
    resource:
      from: data.sinks
      filter: r.?destination.orValue("").startsWith("storage.googleapis.com/")
      kind: logging.googleapis.com/LogSink
      name: r.name
    check:
      assert: |
        data.buckets.filter(b, "storage.googleapis.com/" + b.name == r.destination)
          .all(b, b.?retention_policy.?isLocked.orValue(false) == true)
      review_when: |
        !data.buckets.exists(b, "storage.googleapis.com/" + b.name == r.destination)
      message: "Sink {{ .r.name }} exports to {{ .r.destination }}, whose retention policy is missing or not locked"
      review_message: "Sink {{ .r.name }} exports to {{ .r.destination }}, which is not a bucket in this project; verify the retention policy and Bucket Lock in the project that owns it"
    evidence:
      - r.destination
      - "data.buckets.filter(b, 'storage.googleapis.com/' + b.name == r.destination).map(b, b.?retention_policy.orValue({}))"
    remediation: |
      gsutil retention set <DURATION> gs://<BUCKET_NAME> && gsutil retention lock gs://<BUCKET_NAME>
      or: gcloud storage buckets update gs://<BUCKET_NAME> --retention-period=<DURATION>
      then: gcloud storage buckets update gs://<BUCKET_NAME> --lock-retention-period  (irreversible)
    references:
      - https://cloud.google.com/storage/docs/bucket-lock
      - https://cloud.google.com/storage/docs/using-bucket-lock
    notes: |
      Population is every project sink whose destination is a Cloud Storage bucket. Buckets are listed
      once and matched in CEL by "storage.googleapis.com/" + name; the matched bucket must have a
      retention policy with isLocked=true (a locked policy always carries a retention period).
      gcloud storage prints snake_case top-level keys (name, storage_url, retention_policy) rather than
      REST camelCase; retention_policy itself keeps the API keys retentionPeriod and isLocked.
      A destination bucket owned by another project cannot be read from this project and produces
      REVIEW; verify it by scanning the owning project, then exempt the sink here. The bucket listing
      uses on_error: empty so a project without the Cloud Storage API still reports its storage sinks
      as REVIEW instead of NOT_APPLICABLE. Organization and folder sinks are not evaluated.

  - id: cis-gcp-2.5
    ref: "2.5"
    title: Ensure Log Metric Filter and Alerts Exist for Project Ownership Assignments/Changes
    profile: L1
    cis_assessment: automated
    mode: deterministic
    severity: medium
    scope: project
    collect:
      - id: metrics
        gcloud: logging metrics list --project={{ .project }} --format=json
        on_error: empty
      - id: alert_policies
        # Monitoring Policy JSON keeps the fields the assert needs: enabled, conditions, notificationChannels, etc.
        gcloud: monitoring policies list --project={{ .project }} --format=json
        on_error: empty
    params:
      filter_patterns:
        - 'cloudresourcemanager\.googleapis\.com'
        - 'ProjectOwnership|projectOwnerInvitee'
        - 'roles/owner'
      require_notification_channel: true
    check:
      assert: |
        data.metrics.exists(m,
          params.filter_patterns.all(p, m.?filter.orValue("").matches(p))
          && data.alert_policies.exists(ap,
               ap.?enabled.orValue(false)
               && (!params.require_notification_channel || size(ap.?notificationChannels.orValue([])) > 0)
               && ap.?conditions.orValue([]).exists(c,
                    c.?conditionThreshold.?filter.orValue("").contains("logging.googleapis.com/user/" + m.name))))
      message: "No enabled alert policy backed by a log metric for project ownership changes"
    evidence: ["data.metrics.map(m, m.name)", "data.alert_policies.map(p, p.displayName)"]
    remediation: |
      gcloud logging metrics create <NAME> --description="Owner changes" --log-filter='<FILTER>'
      then create an alert policy on logging.googleapis.com/user/<NAME> with a notification channel
    references:
      - https://cloud.google.com/logging/docs/logs-based-metrics/
      - https://cloud.google.com/monitoring/alerts
    notes: |
      Alert policies are collected with the GA gcloud monitoring policies list command. Its JSON
      resources expose the Monitoring API alert-policy fields consumed by the assertion.
      Filter matching is pattern-based rather than exact-string to tolerate whitespace and quoting
      differences. A notification channel is required by default; set
      require_notification_channel=false to relax.

  - id: cis-gcp-2.6
    ref: "2.6"
    title: Ensure That the Log Metric Filter and Alerts Exist for Audit Configuration Changes
    profile: L1
    cis_assessment: automated
    mode: deterministic
    severity: medium
    scope: project
    collect:
      - id: metrics
        gcloud: logging metrics list --project={{ .project }} --format=json
        on_error: empty
      - id: alert_policies
        # Monitoring Policy JSON keeps the fields the assert needs.
        gcloud: monitoring policies list --project={{ .project }} --format=json
        on_error: empty
    params:
      filter_patterns:
        - 'protoPayload\.methodName\s*[:=]\s*"?[\w.]*SetIamPolicy'
        - 'protoPayload\.serviceData\.policyDelta\.auditConfigDeltas'
      require_notification_channel: true
    check:
      assert: |
        data.metrics.exists(m,
          params.filter_patterns.all(p, m.?filter.orValue("").matches(p))
          && data.alert_policies.exists(ap,
               ap.?enabled.orValue(false)
               && (!params.require_notification_channel || size(ap.?notificationChannels.orValue([])) > 0)
               && ap.?conditions.orValue([]).exists(c,
                    c.?conditionThreshold.?filter.orValue("").contains("logging.googleapis.com/user/" + m.name))))
        || data.alert_policies.exists(ap,
             ap.?enabled.orValue(false)
             && (!params.require_notification_channel || size(ap.?notificationChannels.orValue([])) > 0)
             && ap.?conditions.orValue([]).exists(c,
                  params.filter_patterns.all(p, c.?conditionMatchedLog.?filter.orValue("").matches(p))))
      message: "No enabled alert policy backed by a log metric or a log-match condition for audit configuration changes"
    evidence:
      - "data.metrics.filter(m, params.filter_patterns.all(p, m.?filter.orValue('').matches(p))).map(m, m.name)"
      - "data.alert_policies.map(p, p.?displayName.orValue(p.name))"
    remediation: |
      gcloud logging metrics create <NAME> --description="Audit configuration changes" --log-filter='protoPayload.methodName="SetIamPolicy" AND protoPayload.serviceData.policyDelta.auditConfigDeltas:*'
      then create an alert policy on logging.googleapis.com/user/<NAME> with a notification channel
    references:
      - https://cloud.google.com/logging/docs/logs-based-metrics/
      - https://cloud.google.com/monitoring/alerts/
      - https://cloud.google.com/logging/docs/audit/configure-data-access
    notes: |
      Same strategy as 2.5: a user-defined log metric whose filter matches every regex in
      filter_patterns, plus an enabled alert policy with a conditionThreshold on
      logging.googleapis.com/user/<metric>. A log-based alert policy whose conditionMatchedLog.filter
      matches the same patterns is accepted as an alternative. The patterns follow the CIS filter
      (SetIamPolicy plus a reference to policyDelta.auditConfigDeltas) and tolerate whitespace,
      optional quotes and the = or : operator; override filter_patterns when an equivalent filter is
      written differently. GA gcloud monitoring policies list supplies the alert-policy fields used by the
      assertion. Set require_notification_channel=false to relax.

  - id: cis-gcp-2.7
    ref: "2.7"
    title: Ensure That the Log Metric Filter and Alerts Exist for Custom Role Changes
    profile: L1
    cis_assessment: automated
    mode: deterministic
    severity: medium
    scope: project
    collect:
      - id: metrics
        gcloud: logging metrics list --project={{ .project }} --format=json
        on_error: empty
      - id: alert_policies
        # Monitoring Policy JSON keeps the fields the assert needs.
        gcloud: monitoring policies list --project={{ .project }} --format=json
        on_error: empty
    params:
      filter_patterns:
        - 'resource\.type\s*[:=]\s*"?iam_role'
        - 'protoPayload\.methodName\s*[:=]\s*"?[\w.]*CreateRole'
        - 'protoPayload\.methodName\s*[:=]\s*"?[\w.]*DeleteRole'
        - 'protoPayload\.methodName\s*[:=]\s*"?[\w.]*UpdateRole'
        - 'protoPayload\.methodName\s*[:=]\s*"?[\w.]*UndeleteRole'
      require_notification_channel: true
    check:
      assert: |
        data.metrics.exists(m,
          params.filter_patterns.all(p, m.?filter.orValue("").matches(p))
          && data.alert_policies.exists(ap,
               ap.?enabled.orValue(false)
               && (!params.require_notification_channel || size(ap.?notificationChannels.orValue([])) > 0)
               && ap.?conditions.orValue([]).exists(c,
                    c.?conditionThreshold.?filter.orValue("").contains("logging.googleapis.com/user/" + m.name))))
        || data.alert_policies.exists(ap,
             ap.?enabled.orValue(false)
             && (!params.require_notification_channel || size(ap.?notificationChannels.orValue([])) > 0)
             && ap.?conditions.orValue([]).exists(c,
                  params.filter_patterns.all(p, c.?conditionMatchedLog.?filter.orValue("").matches(p))))
      message: "No enabled alert policy backed by a log metric or a log-match condition for custom role changes"
    evidence:
      - "data.metrics.filter(m, params.filter_patterns.all(p, m.?filter.orValue('').matches(p))).map(m, m.name)"
      - "data.alert_policies.map(p, p.?displayName.orValue(p.name))"
    remediation: |
      gcloud logging metrics create <NAME> --description="Custom role changes" --log-filter='resource.type="iam_role" AND (protoPayload.methodName="google.iam.admin.v1.CreateRole" OR protoPayload.methodName="google.iam.admin.v1.DeleteRole" OR protoPayload.methodName="google.iam.admin.v1.UpdateRole" OR protoPayload.methodName="google.iam.admin.v1.UndeleteRole")'
      then create an alert policy on logging.googleapis.com/user/<NAME> with a notification channel
    references:
      - https://cloud.google.com/logging/docs/logs-based-metrics/
      - https://cloud.google.com/monitoring/alerts/
      - https://cloud.google.com/iam/docs/understanding-custom-roles
    notes: |
      Same strategy as 2.5: a user-defined log metric whose filter matches every regex in
      filter_patterns, plus an enabled alert policy with a conditionThreshold on
      logging.googleapis.com/user/<metric>. A log-based alert policy whose conditionMatchedLog.filter
      matches the same patterns is accepted as an alternative. The patterns follow the CIS filter clause
      by clause (resource.type iam_role and the CreateRole, DeleteRole, UpdateRole and UndeleteRole
      methods, as in CIS v5) and tolerate whitespace, optional quotes, the = or : operator and the
      google.iam.admin.v1 prefix; override filter_patterns when an equivalent filter is written
      differently, e.g. as one regex methodName clause. GA gcloud monitoring policies list supplies the alert-policy fields used by the assertion. Set require_notification_channel=false to relax.

  - id: cis-gcp-2.8
    ref: "2.8"
    title: Ensure That the Log Metric Filter and Alerts Exist for VPC Network Firewall Rule Changes
