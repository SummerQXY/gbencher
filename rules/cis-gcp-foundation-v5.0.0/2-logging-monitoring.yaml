      - "data.alert_policies.map(p, p.?displayName.orValue(p.name))"
    remediation: |
      gcloud logging metrics create <NAME> --description="Route changes" --log-filter='resource.type="gce_route" AND (protoPayload.methodName:"compute.routes.delete" OR protoPayload.methodName:"compute.routes.insert")'
      then create an alert policy on logging.googleapis.com/user/<NAME> with a notification channel
    references:
      - https://cloud.google.com/logging/docs/logs-based-metrics/
      - https://cloud.google.com/monitoring/custom-metrics/
      - https://cloud.google.com/monitoring/alerts/
    notes: |
      Same strategy as 2.5: a user-defined log metric whose filter matches every regex in
      filter_patterns, plus an enabled alert policy with a conditionThreshold on
      logging.googleapis.com/user/<metric>. A log-based alert policy whose conditionMatchedLog.filter
      matches the same patterns is accepted as an alternative. The patterns follow the CIS filter clause
      by clause (resource.type gce_route and the delete and insert methods) and tolerate whitespace,
      optional quotes, the = or : operator and v1./beta. method prefixes; override filter_patterns when
      an equivalent filter is written differently. GA gcloud monitoring policies list supplies the alert-policy fields used by the assertion. Set require_notification_channel=false to relax.

  - id: cis-gcp-2.10
    ref: "2.10"
    title: Ensure That the Log Metric Filter and Alerts Exist for VPC Network Changes
    profile: L2
    cis_assessment: automated
    mode: deterministic
    severity: medium
    scope: project
    collect:
      - id: metrics
        gcloud: logging metrics list --project={{ .project }} --format=json
        on_error: empty
      - id: alert_policies
        # Monitoring Policy JSON keeps the fields the assert needs.
        gcloud: monitoring policies list --project={{ .project }} --format=json
        on_error: empty
    params:
      filter_patterns:
        - 'resource\.type\s*[:=]\s*"?gce_network'
        - 'protoPayload\.methodName\s*[:=]\s*"?[\w.]*compute\.networks\.insert'
        - 'protoPayload\.methodName\s*[:=]\s*"?[\w.]*compute\.networks\.patch'
        - 'protoPayload\.methodName\s*[:=]\s*"?[\w.]*compute\.networks\.delete'
        - 'protoPayload\.methodName\s*[:=]\s*"?[\w.]*compute\.networks\.removePeering'
        - 'protoPayload\.methodName\s*[:=]\s*"?[\w.]*compute\.networks\.addPeering'
      require_notification_channel: true
    check:
      assert: |
        data.metrics.exists(m,
          params.filter_patterns.all(p, m.?filter.orValue("").matches(p))
          && data.alert_policies.exists(ap,
               ap.?enabled.orValue(false)
               && (!params.require_notification_channel || size(ap.?notificationChannels.orValue([])) > 0)
               && ap.?conditions.orValue([]).exists(c,
                    c.?conditionThreshold.?filter.orValue("").contains("logging.googleapis.com/user/" + m.name))))
        || data.alert_policies.exists(ap,
             ap.?enabled.orValue(false)
             && (!params.require_notification_channel || size(ap.?notificationChannels.orValue([])) > 0)
             && ap.?conditions.orValue([]).exists(c,
                  params.filter_patterns.all(p, c.?conditionMatchedLog.?filter.orValue("").matches(p))))
      message: "No enabled alert policy backed by a log metric or a log-match condition for VPC network changes"
    evidence:
      - "data.metrics.filter(m, params.filter_patterns.all(p, m.?filter.orValue('').matches(p))).map(m, m.name)"
      - "data.alert_policies.map(p, p.?displayName.orValue(p.name))"
    remediation: |
      gcloud logging metrics create <NAME> --description="VPC network changes" --log-filter='resource.type="gce_network" AND (protoPayload.methodName:"compute.networks.insert" OR protoPayload.methodName:"compute.networks.patch" OR protoPayload.methodName:"compute.networks.delete" OR protoPayload.methodName:"compute.networks.removePeering" OR protoPayload.methodName:"compute.networks.addPeering")'
      then create an alert policy on logging.googleapis.com/user/<NAME> with a notification channel
    references:
      - https://cloud.google.com/logging/docs/logs-based-metrics/
      - https://cloud.google.com/monitoring/alerts/
      - https://cloud.google.com/vpc/docs/overview
    notes: |
      Same strategy as 2.5: a user-defined log metric whose filter matches every regex in
      filter_patterns, plus an enabled alert policy with a conditionThreshold on
      logging.googleapis.com/user/<metric>. A log-based alert policy whose conditionMatchedLog.filter
      matches the same patterns is accepted as an alternative. The patterns follow the CIS filter clause
      by clause (resource.type gce_network and the insert, patch, delete, removePeering and addPeering
      methods). The CIS console filter (methodName:"compute.networks.insert") and CLI filter
      (methodName="beta.compute.networks.insert", "v1.compute.networks.delete") both match because the
      patterns tolerate whitespace, optional quotes, the = or : operator and method prefixes; override
      filter_patterns when an equivalent filter is written differently. GA gcloud monitoring policies list
      supplies the alert-policy fields used by the assertion. Set require_notification_channel=false
      to relax.

