  - id: cis-gcp-6.4
    ref: "6.4"
    title: Ensure That the Cloud SQL Database Instance Requires All Incoming Connections To Use SSL
    profile: L1
    cis_assessment: automated
    mode: deterministic
    severity: high
    scope: project
    services: [sqladmin.googleapis.com]
    collect:
      - id: sql_instances
        gcloud: sql instances list --project={{ .project }} --format=json
    resource:
      from: data.sql_instances
      filter: r.?instanceType.orValue("") != "ON_PREMISES_INSTANCE"
      kind: sqladmin.googleapis.com/Instance
      name: r.name
    check:
      assert: |
        r.settings.?ipConfiguration.?sslMode.orValue("SSL_MODE_UNSPECIFIED") in ["ENCRYPTED_ONLY", "TRUSTED_CLIENT_CERTIFICATE_REQUIRED"]
        || (r.settings.?ipConfiguration.?sslMode.orValue("SSL_MODE_UNSPECIFIED") == "SSL_MODE_UNSPECIFIED"
            && r.settings.?ipConfiguration.?requireSsl.orValue(false))
      message: "Instance {{ .r.name }} accepts unencrypted connections: sslMode is not ENCRYPTED_ONLY or TRUSTED_CLIENT_CERTIFICATE_REQUIRED"
    evidence: [r.databaseVersion, r.settings.ipConfiguration.sslMode, r.settings.ipConfiguration.requireSsl]
    remediation: |
      gcloud sql instances patch <INSTANCE> --ssl-mode=ENCRYPTED_ONLY
      (MySQL and PostgreSQL can use --ssl-mode=TRUSTED_CLIENT_CERTIFICATE_REQUIRED and distribute client certificates)
    references:
      - https://cloud.google.com/sql/docs/postgres/configure-ssl-instance/
      - https://docs.cloud.google.com/sql/docs/mysql/authorize-ssl
      - https://docs.cloud.google.com/sql/docs/mysql/configure-ssl-instance#console
    notes: |
      Applies to every engine and to every instance type except on-premises source representation
      instances, which do not accept client connections. The sqladmin API gives sslMode priority over the
      legacy requireSsl field, so an instance passes when sslMode is ENCRYPTED_ONLY or
      TRUSTED_CLIENT_CERTIFICATE_REQUIRED; requireSsl=true is honoured only when sslMode is absent or
      SSL_MODE_UNSPECIFIED (legacy configurations). An absent sslMode is treated as
      ALLOW_UNENCRYPTED_AND_ENCRYPTED, the CIS default. Private-only instances without authorized networks
      still fail, as in CIS, because networks added later would not enforce SSL. Enforcing the Cloud SQL
      connectors through settings.connectorEnforcement is not credited.

  - id: cis-gcp-6.5
    ref: "6.5"
    title: Ensure That Cloud SQL Database Instances Do Not Implicitly Whitelist All Public IP Addresses
    profile: L1
    cis_assessment: automated
    mode: deterministic
    severity: high
    scope: project
    services: [sqladmin.googleapis.com]
    collect:
      - id: sql_instances
        gcloud: sql instances list --project={{ .project }} --format=json
    resource:
      from: data.sql_instances
      filter: r.?instanceType.orValue("") != "ON_PREMISES_INSTANCE"
      kind: sqladmin.googleapis.com/Instance
      name: r.name
    check:
      assert: |
        !r.settings.?ipConfiguration.?authorizedNetworks.orValue([]).exists(n, has(n.value) && cidrIsPublic(n.value))
      message: "Instance {{ .r.name }} has an authorized network that allows every address (0.0.0.0/0)"
    evidence: [r.settings.ipConfiguration.authorizedNetworks, r.settings.ipConfiguration.ipv4Enabled]
    remediation: |
      gcloud sql instances patch <INSTANCE> --authorized-networks=<TRUSTED_CIDR_1>,<TRUSTED_CIDR_2>
      (the list replaces the existing one; --clear-authorized-networks removes all entries)
    references:
      - https://cloud.google.com/sql/docs/mysql/configure-ip
      - https://cloud.google.com/sql/docs/mysql/connection-org-policy
      - https://cloud.google.com/resource-manager/docs/organization-policy/org-policy-constraints
    notes: |
      Fails when any settings.ipConfiguration.authorizedNetworks value satisfies cidrIsPublic
      (0.0.0.0/0, ::/0 or any /0 prefix). Like the CIS audit, the rule does not depend on whether public
      IP is enabled (6.7 covers public IP), so a dormant 0.0.0.0/0 entry still fails. Limitation: broad
      ranges that are not /0, such as 0.0.0.0/1 plus 128.0.0.0/1, are not detected. Prevention: the
      constraints/sql.restrictAuthorizedNetworks organization policy.

  - id: cis-gcp-6.6
    ref: "6.6"
    title: Ensure Cloud SQL Database Instances Have IAM Database Authentication Enabled
    profile: L1
    cis_assessment: manual
    mode: deterministic
    severity: medium
    scope: project
    services: [sqladmin.googleapis.com]
    collect:
      - id: sql_instances
        gcloud: sql instances list --project={{ .project }} --format=json
    resource:
      from: data.sql_instances
      filter: |
        r.?instanceType.orValue("") != "ON_PREMISES_INSTANCE"
        && (r.?databaseVersion.orValue("").startsWith("MYSQL") || r.?databaseVersion.orValue("").startsWith("POSTGRES"))
      kind: sqladmin.googleapis.com/Instance
      name: r.name
    params:
      mysql_flag: cloudsql_iam_authentication
      postgres_flag: cloudsql.iam_authentication
    check:
      assert: |
        r.settings.?databaseFlags.orValue([]).exists(f,
          f.name == (r.databaseVersion.startsWith("POSTGRES") ? params.postgres_flag : params.mysql_flag)
          && f.?value.orValue("") == "on")
      message: "Instance {{ .r.name }} ({{ .r.databaseVersion }}) does not set its IAM database authentication flag to on"
    evidence:
      - r.databaseVersion
      - 'r.settings.?databaseFlags.orValue([]).filter(f, f.name in [params.mysql_flag, params.postgres_flag])'
    remediation: |
      PostgreSQL: gcloud sql instances patch <INSTANCE> --database-flags=cloudsql.iam_authentication=on
      MySQL: gcloud sql instances patch <INSTANCE> --database-flags=cloudsql_iam_authentication=on
      (--database-flags replaces the whole flag list, so include every flag to keep), then add IAM users:
      gcloud sql users create <EMAIL> --instance=<INSTANCE> --type=CLOUD_IAM_USER
    references:
      - https://cloud.google.com/sql/docs/postgres/iam-authentication
      - https://cloud.google.com/sql/docs/mysql/iam-authentication
    notes: |
      CIS marks this Manual, but its audit is a deterministic flag check. The flag name depends on the
      engine: PostgreSQL uses cloudsql.iam_authentication and MySQL uses cloudsql_iam_authentication. The
      default is off, so the flag must be explicitly on. SQL Server is filtered out because it does not
      support IAM database authentication; on-premises source representation instances are excluded; read
      replicas are evaluated because CIS audits every MySQL and PostgreSQL instance. Not covered: whether
      IAM database users exist and whether password users remain, which CIS lists as remediation steps
      rather than audit steps. The CIS text has no References section; the links are the product docs.

  - id: cis-gcp-6.7
    ref: "6.7"
    title: Ensure That Cloud SQL Database Instances Do Not Have Public IPs
    profile: L2
    cis_assessment: automated
    mode: deterministic
    severity: high
    scope: project
    services: [sqladmin.googleapis.com]
    collect:
      - id: sql_instances
        gcloud: sql instances list --project={{ .project }} --format=json
    resource:
      from: data.sql_instances
      filter: r.?instanceType.orValue("") != "ON_PREMISES_INSTANCE"
      kind: sqladmin.googleapis.com/Instance
      name: r.name
    params:
      allowed_instance_patterns: []
    check:
      assert: |
        params.allowed_instance_patterns.exists(p, r.name.matches(p))
        || (
          !r.settings.?ipConfiguration.?ipv4Enabled.orValue(true)
          && !r.?ipAddresses.orValue([]).exists(a, a.?type.orValue("") in ["PRIMARY", "MIGRATED_1ST_GEN"])
        )
      message: "Instance {{ .r.name }} has a public IP address (ipv4Enabled is not false or a PRIMARY address is assigned)"
    evidence: [r.instanceType, r.settings.ipConfiguration.ipv4Enabled, r.ipAddresses]
    remediation: |
      gcloud sql instances patch <INSTANCE> --network=<VPC_NETWORK> --no-assign-ip
      (set up private services access or Private Service Connect first)
    references:
      - https://cloud.google.com/sql/docs/mysql/configure-private-ip
      - https://cloud.google.com/sql/docs/mysql/private-ip
      - https://cloud.google.com/resource-manager/docs/organization-policy/org-policy-constraints
    notes: |
      Fails when settings.ipConfiguration.ipv4Enabled is not explicitly false (absent is treated as public,
      the CIS default) or when ipAddresses contains a PRIMARY (public) or MIGRATED_1ST_GEN (public
      first-generation) address. A PRIVATE address is not required, so instances reachable only through
      Private Service Connect pass. Unlike the CIS audit, read replicas and read pools are evaluated too: a
      replica holding a PRIMARY address has a public endpoint whatever its origin, and a replica of a
      private primary passes. On-premises source representation instances are excluded.
      allowed_instance_patterns (RE2 matched against the instance name, empty by default) accepts known
      public instances; prefer profile exemptions when an exception needs a reason and an expiry.

  - id: cis-gcp-6.8
    ref: "6.8"
    title: Ensure That Cloud SQL Database Instances Are Configured With Automated Backups
    profile: L1
    cis_assessment: automated
    mode: deterministic
    severity: medium
    scope: project
    services: [sqladmin.googleapis.com]
    collect:
      - id: sql_instances
        gcloud: sql instances list --project={{ .project }} --format=json
    resource:
      from: data.sql_instances
      filter: r.?instanceType.orValue("CLOUD_SQL_INSTANCE") == "CLOUD_SQL_INSTANCE"
      kind: sqladmin.googleapis.com/Instance
      name: r.name
    params:
      require_point_in_time_recovery: false
    check:
      assert: |
        (r.settings.?backupConfiguration.?enabled.orValue(false)
          || r.settings.?backupConfiguration.?backupTier.orValue("") == "ENHANCED")
        && (!params.require_point_in_time_recovery
          || r.settings.?backupConfiguration.?pointInTimeRecoveryEnabled.orValue(false)
          || r.settings.?backupConfiguration.?binaryLogEnabled.orValue(false))
      message: "Instance {{ .r.name }} does not have automated backups (or the required point-in-time recovery) enabled"
    evidence: [r.databaseVersion, r.settings.backupConfiguration]
    remediation: |
      gcloud sql instances patch <INSTANCE> --backup-start-time=<HH:MM>
      For point-in-time recovery also pass --enable-point-in-time-recovery (PostgreSQL, SQL Server) or --enable-bin-log (MySQL).
    references:
      - https://cloud.google.com/sql/docs/mysql/backup-recovery/backups
      - https://cloud.google.com/sql/docs/postgres/backup-recovery/backups
      - https://cloud.google.com/sql/docs/sqlserver/backup-recovery/backups
    notes: |
      The population is primary instances (instanceType CLOUD_SQL_INSTANCE), matching the CIS jq filter:
      read replicas and read pools cannot have automated backups, and on-premises source representation
      instances are not backed up by Cloud SQL. Backups are off by default, so absence fails. An instance
      passes when settings.backupConfiguration.enabled is true or backupTier is ENHANCED (backups scheduled
      by a Backup and DR backup plan). CIS does not require point-in-time recovery; set
      require_point_in_time_recovery=true to also require pointInTimeRecoveryEnabled (PostgreSQL, SQL
      Server) or binaryLogEnabled (MySQL). The backup window (startTime) is reported in evidence.

  - id: cis-gcp-6.9
    ref: "6.9"
    title: Ensure Cloud SQL Database Instances Have Deletion Protection Enabled
    profile: L1
    cis_assessment: manual
    mode: deterministic
    severity: medium
    scope: project
    services: [sqladmin.googleapis.com]
    collect:
      - id: sql_instances
        gcloud: sql instances list --project={{ .project }} --format=json
    resource:
      from: data.sql_instances
      filter: r.?instanceType.orValue("") != "ON_PREMISES_INSTANCE"
      kind: sqladmin.googleapis.com/Instance
      name: r.name
    check:
      assert: r.settings.?deletionProtectionEnabled.orValue(false) == true
      message: "Instance {{ .r.name }} does not have deletion protection enabled"
    evidence: [r.instanceType, r.settings.deletionProtectionEnabled]
    remediation: gcloud sql instances patch <INSTANCE> --deletion-protection
    references:
      - https://cloud.google.com/sql/docs/mysql/deletion-protection
    notes: |
      CIS marks this Manual, but its audit is a single field check, so the rule is deterministic.
      Deletion protection is off by default, so an absent or false settings.deletionProtectionEnabled
      fails. Every instance type is evaluated, including read replicas and read pools, because the CIS
      audit covers all instances; on-premises source representation instances are excluded. The CIS text
      has no References section; the link is the product doc.
