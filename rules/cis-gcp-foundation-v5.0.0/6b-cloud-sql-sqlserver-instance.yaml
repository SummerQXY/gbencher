dsl_version: 1
benchmark:
  id: cis-gcp-foundation
  version: "5.0.0"
  section: "6"
  title: Cloud SQL Database Services (SQL Server flags and instance settings)
rules:
  - id: cis-gcp-6.3.1
    ref: "6.3.1"
    title: Ensure 'external scripts enabled' Database Flag for Cloud SQL SQL Server Instance Is Set to 'off'
    profile: L1
    cis_assessment: automated
    mode: deterministic
    severity: medium
    scope: project
    services: [sqladmin.googleapis.com]
    collect:
      - id: sql_instances
        gcloud: sql instances list --project={{ .project }} --format=json
    resource:
      from: data.sql_instances
      filter: r.?databaseVersion.orValue("").startsWith("SQLSERVER")
      kind: sqladmin.googleapis.com/Instance
      name: r.name
    params:
      flag: external scripts enabled
      expected: "off"
    check:
      assert: |
        !r.settings.?databaseFlags.orValue([]).exists(f, f.name == params.flag && f.value != params.expected)
      message: "Instance {{ .r.name }} sets '{{ .params.flag }}' to a value other than {{ .params.expected }}"
    evidence: [r.settings.databaseFlags]
    remediation: gcloud sql instances patch <INSTANCE> --database-flags="external scripts enabled"=off
    references:
      - https://cloud.google.com/sql/docs/sqlserver/flags
    notes: |
      The CIS default value for this flag is off, so an absent flag is compliant; only an explicit
      non-off value fails. Flags whose default is non-compliant must require explicit presence instead.

  - id: cis-gcp-6.3.2
    ref: "6.3.2"
    title: Ensure 'cross db ownership chaining' Database Flag for Cloud SQL SQL Server Instance Is Set to 'off'
    profile: L1
    cis_assessment: automated
    mode: deterministic
    severity: medium
    scope: project
    services: [sqladmin.googleapis.com]
    collect:
      - id: sql_instances
        gcloud: sql instances list --project={{ .project }} --format=json
    resource:
      from: data.sql_instances
      filter: r.?databaseVersion.orValue("").startsWith("SQLSERVER")
      kind: sqladmin.googleapis.com/Instance
      name: r.name
    params:
      flag: cross db ownership chaining
      expected: "off"
    check:
      assert: |
        !r.settings.?databaseFlags.orValue([]).exists(f, f.name == params.flag && f.?value.orValue("") != params.expected)
      message: "Instance {{ .r.name }} sets '{{ .params.flag }}' to a value other than {{ .params.expected }}"
    evidence:
      - 'r.settings.?databaseFlags.orValue([]).filter(f, f.name == params.flag)'
    remediation: |
      gcloud sql instances patch <INSTANCE> --database-flags="cross db ownership chaining"=off
      (or omit the flag; --database-flags replaces the whole flag list, so include every flag to keep)
    references:
      - https://cloud.google.com/sql/docs/sqlserver/flags
      - https://docs.microsoft.com/en-us/sql/database-engine/configure-windows/cross-db-ownership-chaining-server-configuration-option?view=sql-server-ver15
    notes: |
      The SQL Server default is off and Cloud SQL no longer accepts on for this deprecated flag, so an
      absent flag passes and only an explicit value other than off fails. Removing the flag and setting
      it to off are both compliant, as the CIS audit allows.

  - id: cis-gcp-6.3.3
    ref: "6.3.3"
    title: Ensure 'user Connections' Database Flag for Cloud SQL SQL Server Instance Is Set to a Non-limiting Value
    profile: L1
    cis_assessment: automated
    mode: deterministic
    severity: low
    scope: project
    services: [sqladmin.googleapis.com]
    collect:
      - id: sql_instances
        gcloud: sql instances list --project={{ .project }} --format=json
    resource:
      from: data.sql_instances
      filter: r.?databaseVersion.orValue("").startsWith("SQLSERVER")
      kind: sqladmin.googleapis.com/Instance
      name: r.name
    params:
      flag: user connections
      non_limiting_values: ["0", "32767"]
    check:
      assert: |
        !r.settings.?databaseFlags.orValue([]).exists(f,
          f.name == params.flag && !(f.?value.orValue("") in params.non_limiting_values))
      message: "Instance {{ .r.name }} sets '{{ .params.flag }}' to a limiting value (expected unset or one of {{ .params.non_limiting_values }})"
    evidence:
      - 'r.settings.?databaseFlags.orValue([]).filter(f, f.name == params.flag)'
    remediation: |
      gcloud sql instances patch <INSTANCE> --database-flags="user connections"=0
      (or omit the flag; --database-flags replaces the whole flag list, so include every flag to keep)
    references:
      - https://cloud.google.com/sql/docs/sqlserver/flags
      - https://docs.microsoft.com/en-us/sql/database-engine/configure-windows/configure-the-user-connections-server-configuration-option?view=sql-server-ver15
    notes: |
      The default 0 lets SQL Server allocate connections up to the 32,767 maximum, so an absent flag
      passes. CIS audits for 0; 32767 is also accepted because it equals the engine maximum and therefore
      does not limit connections. Any other explicit value fails. The CIS remediation mentions an
      organization-recommended value: an instance that caps connections on purpose should get a profile
      exemption rather than a change to non_limiting_values.

  - id: cis-gcp-6.3.4
    ref: "6.3.4"
    title: Ensure 'user options' Database Flag for Cloud SQL SQL Server Instance Is Not Configured
    profile: L1
    cis_assessment: automated
    mode: deterministic
    severity: low
    scope: project
    services: [sqladmin.googleapis.com]
    collect:
      - id: sql_instances
        gcloud: sql instances list --project={{ .project }} --format=json
    resource:
      from: data.sql_instances
      filter: r.?databaseVersion.orValue("").startsWith("SQLSERVER")
      kind: sqladmin.googleapis.com/Instance
      name: r.name
    params:
      flag: user options
    check:
      assert: |
        !r.settings.?databaseFlags.orValue([]).exists(f, f.name == params.flag)
      message: "Instance {{ .r.name }} configures the '{{ .params.flag }}' flag, which must not be set"
    evidence:
      - 'r.settings.?databaseFlags.orValue([]).filter(f, f.name == params.flag)'
    remediation: |
      gcloud sql instances patch <INSTANCE> --database-flags=<FLAG1>=<VALUE1>,<FLAG2>=<VALUE2>
      (list every flag to keep except "user options"), or reset all flags with
      gcloud sql instances patch <INSTANCE> --clear-database-flags
    references:
      - https://cloud.google.com/sql/docs/sqlserver/flags
      - https://docs.microsoft.com/en-us/sql/database-engine/configure-windows/configure-the-user-options-server-configuration-option?view=sql-server-ver15
    notes: |
      The default is not configured and the CIS audit expects the jq query to return nothing, so the rule
      fails whenever a 'user options' entry exists, whatever its value (including 0). An absent flag passes.

  - id: cis-gcp-6.3.5
    ref: "6.3.5"
    title: Ensure 'remote access' Database Flag for Cloud SQL SQL Server Instance Is Set to 'off'
    profile: L1
    cis_assessment: automated
    mode: deterministic
    severity: medium
    scope: project
    services: [sqladmin.googleapis.com]
    collect:
      - id: sql_instances
        gcloud: sql instances list --project={{ .project }} --format=json
    resource:
      from: data.sql_instances
      filter: r.?databaseVersion.orValue("").startsWith("SQLSERVER")
      kind: sqladmin.googleapis.com/Instance
      name: r.name
    params:
      flag: remote access
      expected: "off"
    check:
      assert: |
        r.settings.?databaseFlags.orValue([]).exists(f, f.name == params.flag && f.?value.orValue("") == params.expected)
      message: "Instance {{ .r.name }} does not explicitly set '{{ .params.flag }}' to {{ .params.expected }} (the SQL Server default is on)"
    evidence:
      - 'r.settings.?databaseFlags.orValue([]).filter(f, f.name == params.flag)'
    remediation: |
      gcloud sql instances patch <INSTANCE> --database-flags="remote access"=off
      (--database-flags replaces the whole flag list, so include every flag to keep; the instance restarts)
    references:
      - https://cloud.google.com/sql/docs/sqlserver/flags
      - https://docs.microsoft.com/en-us/sql/database-engine/configure-windows/configure-the-remote-access-server-configuration-option?view=sql-server-ver15
    notes: |
      The SQL Server default for remote access is on, which is non-compliant, so an absent flag fails: the
      rule requires an explicit 'remote access' entry set to off.

