    params:
      managed_os_prefix: Container-Optimized OS
    check:
      assert: "true"
      review_when: "!r.?status.?nodeInfo.?osImage.orValue('').startsWith(params.managed_os_prefix)"
      message: "kubelet config file on node {{ .r.metadata.name }}: ownership cannot be verified without node access"
      review_message: "node {{ .r.metadata.name }} does not run Container-Optimized OS; kubelet config file ownership cannot be verified without node access and must be checked manually"
    evidence: [r.status.nodeInfo.osImage]
    remediation: chown root:root /home/kubernetes/kubelet-config.yaml on the node (the file passed to kubelet --config)
    references:
      - https://kubernetes.io/docs/tasks/administer-cluster/kubelet-config-file/
      - https://cloud.google.com/kubernetes-engine/docs/concepts/cis-benchmarks
    notes: |
      Same strategy as 3.1.1. This rule performs a degraded check: without node_exec (removed from
